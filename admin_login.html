<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CampusFind</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header class="site-header">
    <a class="brand" href="index.html">
        <span class="brand-mark">C</span>
        <span>Campus<span class="brand-accent">Find</span></span>
    </a>
</header>

<main class="container">
    <section class="page-heading">
        <p class="eyebrow">CAMPUSFIND ADMINISTRATION</p>
        <h1>Admin Login</h1>
        <p>Sign in to review and verify student claims.</p>
    </section>

    <section class="form-card">
        <form id="adminLoginForm">

            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" class="primary-btn">
                Login as Admin
            </button>

            <p id="formMsg" role="status"></p>
        </form>
    </section>
</main>

<script>
const form = document.getElementById('adminLoginForm');
const message = document.getElementById('formMsg');

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const email = form.email.value.trim().toLowerCase();
    const password = form.password.value;

    message.textContent = 'Checking login...';

    try {
        const response = await fetch('/api/admin/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Login failed.');
        }

        
        window.location.href = 'admin.html';

    } catch (error) {
        message.textContent = error.message;
    }
});
</script>

</body>
</html>
